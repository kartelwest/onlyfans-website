<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14" width="20" height="14" role="img" aria-hidden="true">
  <title>Brasil</title>

  <rect width="20" height="14" fill="#009739"/>

  <polygon points="10,1.3 18.7,7 10,12.7 1.3,7" fill="#FEDD00"/>

  <circle cx="10" cy="7" r="3.5" fill="#012169"/>

  <!--
    The white band is the ring between two circles centred well below the flag,
    clipped to the blue disc — the same construction as the real flag, where the
    banner is an arc of a much larger circle than the globe it crosses.
  -->
  <g clip-path="url(#br-globe)">
    <path
      fill="#FFFFFF"
      fill-rule="evenodd"
      d="M10,16 m-9.4,0 a9.4,9.4 0 1,0 18.8,0 a9.4,9.4 0 1,0 -18.8,0
         M10,16 m-8.6,0 a8.6,8.6 0 1,0 17.2,0 a8.6,8.6 0 1,0 -17.2,0"/>
  </g>

  <clipPath id="br-globe">
    <circle cx="10" cy="7" r="3.5"/>
  </clipPath>

  <!-- A suggestion of the star field. At 16px tall these read as texture. -->
  <g fill="#FFFFFF">
    <circle cx="8.2" cy="5.3" r="0.22"/>
    <circle cx="11.3" cy="5.0" r="0.18"/>
    <circle cx="9.4" cy="4.6" r="0.16"/>
    <circle cx="12.3" cy="6.0" r="0.2"/>
    <circle cx="7.4" cy="6.3" r="0.16"/>
    <circle cx="8.8" cy="9.2" r="0.22"/>
    <circle cx="11.0" cy="9.5" r="0.18"/>
    <circle cx="10.0" cy="10.1" r="0.16"/>
    <circle cx="12.2" cy="8.6" r="0.16"/>
    <circle cx="7.6" cy="8.4" r="0.18"/>
  </g>
</svg>
